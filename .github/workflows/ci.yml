# Required CI gate for the managed review-and-checks ruleset.

name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - "main"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ok:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: exit 0

  # Runs the pinned mise from bootstrap.sh against this checkout. HOME and the
  # XDG directories point at the runner's temp directory, so no real user
  # configuration, cache, or global mise config is read.
  mise:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Isolate mise state
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          {
            echo "HOME=$home"
            echo "XDG_CONFIG_HOME=$home/.config"
            echo "XDG_DATA_HOME=$home/.local/share"
            echo "XDG_CACHE_HOME=$home/.cache"
            echo "XDG_STATE_HOME=$home/.local/state"
            echo "MISE_TRUSTED_CONFIG_PATHS=$GITHUB_WORKSPACE"
            echo "MISE=$home/.local/bin/mise"
          } >>"$GITHUB_ENV"
      - name: Install the pinned mise
        run: ./bootstrap.sh
      - name: Check App Store packages
        run: bash tests/test_mas_packages.sh
      - name: Check the global lockfile
        run: bash tests/test_mise_lock.sh
      - name: Check public home dotfiles
        run: bash tests/test_public_home_dotfiles.sh
      - name: Check the skills sync plan
        run: bash tests/test_skills_sync.sh

  status-check:
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    permissions: {}
    needs:
      - ok
      - mise
    steps:
      - name: Require successful checks
        env:
          OK_RESULT: ${{ needs.ok.result }}
          MISE_RESULT: ${{ needs.mise.result }}
        run: test "$OK_RESULT" = success && test "$MISE_RESULT" = success
