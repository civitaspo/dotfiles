# Minimal CI gate for the default-branch ruleset required context `status-check`.
# Matches the SecureFix client pattern: status-check fails only when a needed job
# fails/cancels; on green it is skipped and the ruleset still allows merge.

name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - "main"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ok:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: exit 0

  status-check:
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    permissions: {}
    needs:
      - ok
    steps:
      - name: Require successful checks
        env:
          JOB_RESULT: ${{ needs.ok.result }}
        run: test "$JOB_RESULT" = success
