# Repository workflows for civitaspo/dotfiles.
# Global tool versions remain in config/mise/config.toml.

[settings]
task.run_auto_install = false

[task_config]
includes = ["mise-tasks"]

# Mac App Store apps, installed by `mise run mas` with the `mas` CLI.
# Run named bootstrap parts only: bare `mise bootstrap` also runs
# [tasks.bootstrap], which installs Nix and Homebrew.
# Keynote/Numbers/Pages use the universal App Store IDs. Apple delisted the
# classic Mac ADAM IDs (409183694, 409203825, 409201541) in April 2026, so
# mas fails those with "No apps found in the App Store". The current
# listings install as Creator Studio builds (com.apple.Keynote and friends)
# alongside any remaining classic iWork apps (com.apple.iWork.*).
[bootstrap.packages]
"mas:1569813296" = "latest" # 1Password for Safari
"mas:937984704" = "latest" # Amphetamine
"mas:1091189122" = "latest" # Bear
"mas:361285480" = "latest" # Keynote
"mas:302584613" = "latest" # Kindle
"mas:6446206067" = "latest" # Klack
"mas:539883307" = "latest" # LINE
"mas:361304891" = "latest" # Numbers
"mas:361309726" = "latest" # Pages
"mas:1501592214" = "latest" # Twingate
"mas:497799835" = "latest" # Xcode
"brew-cask:raycast" = { adopt = true }
"brew-cask:tabtab" = { adopt = true }

[tasks.default]
description = "List available repository tasks."
run = "mise tasks ls --local"
quiet = true

[tasks.bootstrap]
description = "Install Nix and Homebrew on a new Mac."
run = [
  { task = "bootstrap:nix" },
  { task = "bootstrap:homebrew" },
]

[tasks.reconcile]
description = "Apply the whole configuration to this machine."
run = [
  { task = "switch" },
  { task = "brew-casks" },
  { task = "brew" },
  { task = "mas" },
  { task = "tools" },
]

[tasks.brew]
description = "Apply the Brewfile and remove unlisted packages."
run = [
  "bash ./mise-tasks/brew/check-cask-ownership",
  { task = "setup:xcode" },
  { task = "brew:tap" },
  "/opt/homebrew/bin/brew bundle --file ./Brewfile --force-cleanup",
]

[tasks."brew-casks"]
description = "Install Raycast and TabTab through mise."
run = "mise bootstrap packages apply brew-cask:raycast brew-cask:tabtab --yes"

[tasks.mas]
description = "Install missing Mac App Store apps."
run = [
  "mise bootstrap packages apply --manager mas --yes",
  # Run directly because mise deduplicates repeated task references.
  "./mise-tasks/setup/xcode",
]

[tasks.tools]
description = "Install locked tool versions with mise."
run = [
  { task = "tools:install" },
  { task = "setup:plannotator" },
  { task = "skills:sync" },
]

[tasks.update]
description = "Update Nix inputs, mise tools, Homebrew packages, and App Store apps."
run = [
  { task = "update:nix" },
  { task = "update:mise" },
  { task = "update:brew-casks" },
  { task = "update:brew" },
  { task = "update:mas" },
]

[tasks."auth:opencode"]
description = "Connect OpenCode to ChatGPT (choose ChatGPT Pro/Plus in the picker)."
run = "opencode2 auth login openai"

[tasks."auth:cursor"]
description = "Sign in to Cursor Agent."
run = "cursor-agent login"

[tasks."update:nix"]
description = "Update flake inputs and re-activate nix-darwin."
run = [
  "nix flake update",
  { task = "switch" },
]

[tasks."update:mise"]
description = "Upgrade mise-managed tools and drop unused versions."
dir = "{{config_root}}/config/mise"
env = { MISE_GLOBAL_CONFIG_FILE = "{{config_root}}/config/mise/config.toml", MISE_GLOBAL_CONFIG_ROOT = "{{config_root}}/config/mise", MISE_LOCKED = "false" }
run = [
  "mise upgrade",
  "mise prune",
]

[tasks."lock:mise"]
description = "Refresh the committed mise lockfile."
dir = "{{config_root}}/config/mise"
env = { MISE_GLOBAL_CONFIG_FILE = "{{config_root}}/config/mise/config.toml", MISE_GLOBAL_CONFIG_ROOT = "{{config_root}}/config/mise", MISE_LOCKED = "false" }
run = "mise lock --global --platform macos-arm64"

[tasks."update:brew"]
description = "Upgrade Homebrew packages."
run = [
  "bash ./mise-tasks/brew/check-cask-ownership",
  { task = "setup:xcode" },
  { task = "brew:tap" },
  "/opt/homebrew/bin/brew update",
  "/opt/homebrew/bin/brew upgrade",
  "/opt/homebrew/bin/brew bundle --file ./Brewfile --force-cleanup",
  "/opt/homebrew/bin/brew cleanup",
]

[tasks."update:brew-casks"]
description = "Upgrade mise-managed Raycast and TabTab casks."
run = [
  "bash ./mise-tasks/brew/check-cask-ownership --require-mise",
  "mise bootstrap packages upgrade brew-cask:raycast brew-cask:tabtab --yes",
]

[tasks."update:mas"]
description = "Upgrade Mac App Store apps."
run = [
  "mise bootstrap packages upgrade --manager mas --yes",
  # Run directly because mise deduplicates repeated task references.
  "./mise-tasks/setup/xcode",
]

[tasks."livecheck:casks"]
description = "Show newer upstream versions for local tap casks."
run = [
  { task = "brew:tap" },
  "/opt/homebrew/bin/brew livecheck --tap civitaspo/dotfiles --cask --newer-only",
]

[tasks."import:brew"]
description = "Capture the live Homebrew state back into the Brewfile."
run = "/opt/homebrew/bin/brew bundle dump --force --no-vscode --file ./Brewfile"

[tasks.check]
description = "Validate the configuration."
run = [
  { task = "check:nix" },
  { task = "check:nix-lint" },
  { task = "check:shell" },
  { task = "check:mcp-sync" },
  { task = "check:tools-install" },
  { task = "check:skills-sync" },
  { task = "check:1password" },
  { task = "check:github-key" },
  { task = "check:typos" },
]

[tasks."check:nix"]
description = "Validate the nix-darwin configuration."
run = "nix flake check"

[tasks."check:nix-lint"]
description = "Lint Nix files."
run = [
  "deadnix --fail .",
  "nix run --inputs-from . nixpkgs#statix -- check .",
]

[tasks."check:shell"]
description = "Lint and format-check shell scripts."
run = [
  "shellcheck bootstrap.sh mise-tasks/switch mise-tasks/mcp/sync mise-tasks/setup/plannotator mise-tasks/setup/xcode mise-tasks/setup/github-key mise-tasks/bootstrap/nix mise-tasks/bootstrap/homebrew mise-tasks/brew/tap mise-tasks/brew/check-cask-ownership mise-tasks/migrate/cask-ownership mise-tasks/tools/install mise-tasks/skills/plan mise-tasks/skills/sync tests/test_tools_install.sh tests/test_skills_sync.sh tests/test_mcp_sync.sh tests/test_github_key.sh tests/test_mas_packages.sh tests/test_mise_lock.sh tests/test_cask_migration.sh home/bin/* home/.docker/cli-plugins/*",
  "shfmt -d -i 2 -ci bootstrap.sh mise-tasks/switch mise-tasks/mcp/sync mise-tasks/setup/plannotator mise-tasks/setup/xcode mise-tasks/setup/github-key mise-tasks/bootstrap/nix mise-tasks/bootstrap/homebrew mise-tasks/brew/tap mise-tasks/brew/check-cask-ownership mise-tasks/migrate/cask-ownership mise-tasks/tools/install mise-tasks/skills/plan mise-tasks/skills/sync tests/test_tools_install.sh tests/test_skills_sync.sh tests/test_mcp_sync.sh tests/test_github_key.sh tests/test_mas_packages.sh tests/test_mise_lock.sh tests/test_cask_migration.sh home/bin/* home/.docker/cli-plugins/*",
]

[tasks."check:typos"]
description = "Check spelling in source files."
run = "typos"

[tasks."check:tools-install"]
description = "Test recovery of empty mise installations."
run = "bash tests/test_tools_install.sh"

[tasks."check:skills-sync"]
description = "Test the global skills sync plan."
run = "bash tests/test_skills_sync.sh"

[tasks."check:1password"]
description = "Test the 1Password lock entry and its Renovate replacement."
run = "python3 tests/test_renovate_1password.py"

[tasks."check:github-key"]
description = "Test Secure Enclave key setup and GitHub registration retries."
run = "bash tests/test_github_key.sh"

[tasks."check:mcp-sync"]
description = "Test MCP server registration and conflict handling."
run = "bash tests/test_mcp_sync.sh"
